name: Backend CI

on:
  push:
    branches: [ main, copilot/add-upload-file-endpoint ]
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.11
          channels: conda-forge
          channel-priority: strict
          activate-environment: backend-ci
          use-mamba: true

      - name: Install rdkit via conda
        run: mamba install -n backend-ci -c conda-forge rdkit=2023.9.4 -y

      - name: Export environment (debug)
        run: conda list -n backend-ci

      - name: Install pip requirements
        run: |
          conda run -n backend-ci python -m pip install --upgrade pip
          conda run -n backend-ci python -m pip install -r backend/requirements-ci.txt

      - name: Run mypy (non-blocking for now)
        run: |
          conda run -n backend-ci python -m mypy --config-file mypy.ini backend || true

      - name: Run tests with coverage
        run: |
          conda run -n backend-ci python -m pytest -q --cov=backend --cov-report=term-missing --cov-report=xml backend/tests

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            ./.coverage
            ./coverage.xml

